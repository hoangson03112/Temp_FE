<div class="h-screen bg-gray-100 p-4 overflow-hidden flex flex-col">
  <app-layout class="flex-1 flex flex-col h-full overflow-hidden">
    <div
      class="flex-1 flex flex-col h-full bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative"
    >
      <div class="px-3 py-2 border-b border-gray-200 bg-white shadow-xs shrink-0">
        <dx-toolbar>
          <dxi-item location="before" locateInMenu="never">
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-2">
                <i class="dx-icon-folder text-blue-600 text-xl"></i>
                <span class="font-bold text-sm text-gray-800 tracking-tight">
                  Cấu hình In mẫu 12 CBH
                </span>
              </div>
            </div>
          </dxi-item>
        </dx-toolbar>
      </div>

      <div class="flex flex-row flex-1 overflow-hidden relative">
        <main class="flex flex-col flex-1 gap-4 h-full p-6 overflow-hidden bg-gray-50/50">
          <div class="flex gap-6">
            <div class="flex-1 flex flex-col gap-1">
              <label class="text-sm font-medium text-gray-700">Khổ giấy</label>
              <dx-select-box
                [items]="khoGiayOptions"
                displayExpr="text"
                valueExpr="value"
                [value]="customCauHinh.setUpTrang.khoGiay"
                (onValueChanged)="customCauHinh.setUpTrang.khoGiay = $event.value"
                stylingMode="outlined"
              ></dx-select-box>
            </div>
            <div class="flex-1 flex flex-col">
              <label class="text-sm font-medium text-gray-700">Căn lề(mm)</label>
              <div class="flex gap-1">
                <dx-text-box
                  [value]="customCauHinh.setUpTrang.canLeTop"
                  label="Trên"
                  labelMode="floating"
                  displayExpr="number"
                  valueExpr="value"
                  stylingMode="outlined"
                  [showClearButton]="true"
                  (ngModelChange)="updateMargin('canLeTop', $event)"
                ></dx-text-box>
                <dx-text-box
                  [value]="customCauHinh.setUpTrang.canLeRight"
                  label="Phải"
                  labelMode="floating"
                  displayExpr="text"
                  valueExpr="value"
                  stylingMode="outlined"
                  [showClearButton]="true"
                ></dx-text-box>
                <dx-text-box
                  [value]="customCauHinh.setUpTrang.canLeBottom"
                  label="Dưới"
                  labelMode="floating"
                  displayExpr="text"
                  valueExpr="value"
                  stylingMode="outlined"
                  [showClearButton]="true"
                ></dx-text-box>
                <dx-text-box
                  [value]="customCauHinh.setUpTrang.canLeLeft"
                  label="Trái"
                  labelMode="floating"
                  displayExpr="text"
                  valueExpr="value"
                  stylingMode="outlined"
                  [showClearButton]="true"
                ></dx-text-box>
              </div>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="border-0 bg-white rounded-lg shadow-sm overflow-hidden">
              <div
                class="flex justify-between items-center px-4 py-3 bg-gray-50 cursor-pointer select-none hover:bg-gray-100 transition-colors"
                (click)="toggleTable()"
              >
                <span class="font-semibold text-gray-700 text-sm">Người ký</span>

                <i
                  class="dx-icon transition-transform duration-200"
                  [class.dx-icon-chevronup]="isOpenTable"
                  [class.dx-icon-chevrondown]="!isOpenTable"
                >
                </i>
              </div>

              @if (isOpenTable) {
                <div class="p-4 border-t border-gray-200">
                  <dx-data-grid
                    [dataSource]="nguoiKyList"
                    [showBorders]="true"
                    [columnAutoWidth]="true"
                    [showBorders]="false"
                  >
                    <dxi-column dataField="chucDanh" caption="CHỨC DANH"></dxi-column>
                    <dxi-column dataField="tieuDeNguoiKy" caption="TIÊU ĐỀ NGƯỜI KÝ"></dxi-column>
                    <dxi-column
                      dataField="tenNguoiKy"
                      caption="TÊN NGƯỜI KÝ"
                      cellTemplate="inputTemplate"
                    ></dxi-column>
                    <div *dxTemplate="let cell of 'inputTemplate'">
                      <input
                        type="text"
                        class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-200"
                        [ngModel]="getTenNguoiKy(cell.data.id)"
                        (ngModelChange)="updateTenNguoiKy(cell.data.id, $event)"
                        placeholder="Nhập tên người ký..."
                      />
                    </div>
                    <dxi-column
                      dataField="hienThi"
                      caption="HIỂN THỊ"
                      dataType="boolean"
                      alignment="center"
                      cellTemplate="visibleTemplate"
                    ></dxi-column>
                    <div *dxTemplate="let cell of 'visibleTemplate'">
                      <input
                        type="checkbox"
                        [ngModel]="getHienThiNguoiKy(cell.data.id)"
                        (ngModelChange)="updateHienThiNguoiKy(cell.data.id, $event)"
                      />
                    </div>
                  </dx-data-grid>
                </div>
              }
            </div>
          </div>
        </main>
      </div>

      <dx-load-panel
        [visible]="isLoading()"
        [showIndicator]="true"
        [showPane]="true"
        [shading]="true"
        message="Hệ thống đang tải dữ liệu danh mục..."
      ></dx-load-panel>
    </div>
  </app-layout>
</div>
