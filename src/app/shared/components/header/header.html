<header class="bg-white border-b border-slate-200 px-4 py-3">
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <ng-icon name="heroBars3" class="text-2xl cursor-pointer text-slate-500 hover:text-slate-800 transition-colors" (click)="toggleSidebar()"></ng-icon>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-600 hidden sm:block">
        {{ authService.user()?.fullName || authService.user()?.userName || 'Người dùng' }}
      </span>
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700 uppercase cursor-pointer select-none"
           title="{{ authService.user()?.fullName || 'U' }}">
        {{ (authService.user()?.fullName || authService.user()?.userName || 'U').charAt(0).toUpperCase() }}
      </div>
    </div>
  </div>
</header>
